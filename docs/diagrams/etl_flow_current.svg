<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040" role="img" aria-labelledby="title desc">
  <title id="title">Hacienda ETL Flow - Current Architecture</title>
  <desc id="desc">Current pipeline from ODMH API to SQL warehouse with Airflow orchestration, Databricks transformations, and ADLS/SQL auditing.</desc>

  <defs>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .box { stroke: #1e293b; stroke-width: 2; rx: 12; }
      .orchestrator { fill: #dbeafe; }
      .source { fill: #fff7ed; }
      .raw { fill: #fee2e2; }
      .quality { fill: #fef3c7; }
      .staging { fill: #e0f2fe; }
      .curated { fill: #dcfce7; }
      .warehouse { fill: #ede9fe; }
      .audit { fill: #f3e8ff; }
      .infra { fill: #e2e8f0; }
      .line { stroke: #334155; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .line-dashed { stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="1040" fill="#f8fafc" />

  <text x="50" y="68" class="title">Hacienda ETL Pipeline - Current Architecture (Up to Warehouse)</text>
  <text x="50" y="102" class="subtitle">Implemented flow: API ingestion, raw validation, staging/curated/warehouse transformations, ADLS + SQL auditing</text>

  <!-- Orchestrator -->
  <rect x="330" y="125" width="1040" height="90" class="box orchestrator" />
  <text x="368" y="180" class="label">Airflow Orchestration (DAG 00 - DAG 07)</text>

  <!-- Main flow -->
  <rect x="40" y="300" width="220" height="130" class="box source" />
  <text x="72" y="350" class="label">ODMH API</text>
  <text x="72" y="376" class="small">deuda_publica source</text>
  <text x="72" y="402" class="small">Input endpoint</text>

  <rect x="300" y="300" width="220" height="130" class="box raw" />
  <text x="332" y="350" class="label">ADLS Raw</text>
  <text x="332" y="376" class="small">DAG 03 ingestion</text>
  <text x="332" y="402" class="small">execution_date + request_hash</text>

  <rect x="560" y="300" width="220" height="130" class="box quality" />
  <text x="592" y="350" class="label">Raw Validation</text>
  <text x="592" y="376" class="small">DAG 04</text>
  <text x="592" y="402" class="small">Fail-fast quality checks</text>

  <rect x="820" y="300" width="220" height="130" class="box staging" />
  <text x="852" y="350" class="label">ADLS Staging</text>
  <text x="852" y="376" class="small">DAG 05 (Databricks)</text>
  <text x="852" y="402" class="small">raw -&gt; staging</text>

  <rect x="1080" y="300" width="220" height="130" class="box curated" />
  <text x="1112" y="350" class="label">ADLS Curated</text>
  <text x="1112" y="376" class="small">DAG 06 (Databricks)</text>
  <text x="1112" y="402" class="small">staging -&gt; curated</text>

  <rect x="1340" y="300" width="300" height="130" class="box warehouse" />
  <text x="1372" y="350" class="label">SQL Warehouse</text>
  <text x="1372" y="376" class="small">DAG 07 model + load</text>
  <text x="1372" y="402" class="small">dim_* + fact_deuda_corte</text>

  <!-- Databricks -->
  <rect x="820" y="500" width="820" height="150" class="box infra" />
  <text x="852" y="550" class="label">Databricks Notebooks</text>
  <text x="852" y="576" class="small">01_raw_to_stg_deuda_publica</text>
  <text x="852" y="602" class="small">02_stg_to_curated_deuda_publica.py</text>
  <text x="852" y="628" class="small">03_curated_to_warehouse_deuda_publica</text>

  <!-- Audit and bootstrap -->
  <rect x="300" y="740" width="420" height="170" class="box audit" />
  <text x="332" y="790" class="label">ADLS Logs (JSON)</text>
  <text x="332" y="816" class="small">logs/deuda_publica/execution_date=...</text>
  <text x="332" y="842" class="small">logs/deuda_publica/layer=curated/execution_date=...</text>
  <text x="332" y="868" class="small">logs/deuda_publica/layer=warehouse/execution_date=...</text>

  <rect x="760" y="740" width="420" height="170" class="box audit" />
  <text x="792" y="790" class="label">SQL Audit</text>
  <text x="792" y="816" class="small">audit.etl_run_log</text>
  <text x="792" y="842" class="small">audit.pipeline_runs</text>
  <text x="792" y="868" class="small">Covers validation + curated + warehouse</text>

  <rect x="1220" y="740" width="420" height="170" class="box infra" />
  <text x="1252" y="790" class="label">SQL Bootstrap</text>
  <text x="1252" y="816" class="small">DAG 00: create hacienda_dw</text>
  <text x="1252" y="842" class="small">DAG 01: schemas + audit tables</text>
  <text x="1252" y="868" class="small">DAG 02: master key bootstrap</text>

  <!-- Main flow arrows -->
  <path d="M260 365 L300 365" class="line" />
  <path d="M520 365 L560 365" class="line" />
  <path d="M780 365 L820 365" class="line" />
  <path d="M1040 365 L1080 365" class="line" />
  <path d="M1300 365 L1340 365" class="line" />

  <!-- Databricks relation -->
  <path d="M930 430 L930 500" class="line-dashed" />
  <path d="M1190 430 L1190 500" class="line-dashed" />
  <path d="M1490 430 L1490 500" class="line-dashed" />

  <!-- Audit arrows -->
  <path d="M670 430 L500 740" class="line-dashed" />
  <path d="M1190 430 L620 740" class="line-dashed" />
  <path d="M1190 430 L960 740" class="line-dashed" />
  <path d="M1490 430 L970 740" class="line-dashed" />

  <!-- Bootstrap prerequisite -->
  <path d="M1430 740 L1490 430" class="line-dashed" />

  <!-- Orchestrator links -->
  <path d="M850 215 L850 300" class="line-dashed" />
  <path d="M520 215 L150 300" class="line-dashed" />
  <path d="M1180 215 L1490 300" class="line-dashed" />

  <!-- Legend -->
  <rect x="50" y="970" width="16" height="16" class="box source" />
  <text x="74" y="984" class="small">Source</text>
  <rect x="160" y="970" width="16" height="16" class="box raw" />
  <text x="184" y="984" class="small">Raw</text>
  <rect x="260" y="970" width="16" height="16" class="box quality" />
  <text x="284" y="984" class="small">Validation</text>
  <rect x="390" y="970" width="16" height="16" class="box staging" />
  <text x="414" y="984" class="small">Staging</text>
  <rect x="500" y="970" width="16" height="16" class="box curated" />
  <text x="524" y="984" class="small">Curated</text>
  <rect x="610" y="970" width="16" height="16" class="box warehouse" />
  <text x="634" y="984" class="small">Warehouse</text>
  <rect x="740" y="970" width="16" height="16" class="box audit" />
  <text x="764" y="984" class="small">Audit</text>
  <rect x="840" y="970" width="16" height="16" class="box orchestrator" />
  <text x="864" y="984" class="small">Orchestration</text>
</svg>
